<title>Hirelist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Hirelist Compact — heavy rule header, dense rows led by a huge fit number, fixed bottom tab bar; sheets slide up for detail. */
:root {
  --bg: #fbfbf8;
  --surface: #ffffff;
  --fg: #111111;
  --muted: #4d4d48;
  --line: #d7d6cf;
  --rule: #111111;
  --signal: #e8361b;
  --signal-soft: #fff3ef;
  --amber: #9a5a00;
  --amber-soft: #fff1dc;
  --good: #0f7a55;
  --good-soft: #e3f4ec;
  --invert-bg: #111111;
  --invert-fg: #fbfbf8;
  --overlay: rgba(17, 17, 17, 0.45);
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1b1b1a; --fg: #f2f0e9; --muted: #b5b3ab; --line: #33332f; --rule: #f2f0e9;
    --signal: #ff5a3c; --signal-soft: #2a1814; --amber: #f0b54a; --amber-soft: #2e2412; --good: #3ddc97; --good-soft: #13291f;
    --invert-bg: #f2f0e9; --invert-fg: #121212; --overlay: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1b1b1a; --fg: #f2f0e9; --muted: #b5b3ab; --line: #33332f; --rule: #f2f0e9;
  --signal: #ff5a3c; --signal-soft: #2a1814; --amber: #f0b54a; --amber-soft: #2e2412; --good: #3ddc97; --good-soft: #13291f;
  --invert-bg: #f2f0e9; --invert-fg: #121212; --overlay: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.app { max-width: 760px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body.wide .app { max-width: 1240px; }
@media (min-width: 1100px) { body.wide .board { grid-auto-columns: minmax(0, 1fr); overflow-x: visible; } body.wide .board-scroll { display: none; } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 18px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 3px solid var(--rule); }
.brand { font-weight: 900; font-size: 30px; letter-spacing: -0.03em; line-height: 1; margin: 0; }
.brand span { color: var(--signal); }
.stamp { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-align: right; font-variant-numeric: tabular-nums; }

.section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding-block: 16px 8px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.section-label button { background: none; border: 0; padding: 0; color: var(--signal); font: inherit; letter-spacing: inherit; min-height: 28px; }

.list { border-top: 1px solid var(--rule); }
.row { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; background: var(--bg); }
.row .under { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
.row .under .u-left, .row .under .u-right { opacity: 0; }
.row.sw-right .under { background: var(--good); color: var(--invert-fg); }
.row.sw-right .under .u-left { opacity: 1; }
.row.sw-left .under { background: var(--muted); color: var(--bg); }
.row.sw-left .under .u-right { opacity: 1; }
.row-inner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--bg); }
.row.top-pick .row-inner { background: var(--signal-soft); }
.rowmain {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 0 10px; align-items: center;
  width: 100%; text-align: left; background: transparent; border: 0; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 12px; touch-action: pan-y; user-select: none; -webkit-user-select: none; min-height: 64px;
}
.fitnum { font-weight: 900; font-size: 40px; line-height: 0.9; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.fitnum.hi { color: var(--signal); }
.fitnum.none { font-size: 22px; color: var(--muted); }
.rtitle { font-size: 15px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.rmeta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
.tag.new { color: var(--signal); }
.tag.old { color: var(--amber); }
.tag.stage { color: var(--good); }
.tag.dim { color: var(--muted); }
.rowacts { display: none; gap: 6px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 640px) { .rowacts { display: flex; } }
.mini { min-height: 36px; padding: 0 10px; border: 1px solid var(--rule); background: transparent; font-size: 12px; font-weight: 700; }
.mini.solid { background: var(--invert-bg); color: var(--invert-fg); }

.hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; padding-block: 10px; }
.empty { border: 1px dashed var(--line); padding: 24px 18px; text-align: center; color: var(--muted); margin-top: 6px; }
.empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

.fu { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fu-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fu-acts { display: flex; flex-wrap: wrap; gap: 6px; }

.controls { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--rule); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); padding: 0 10px; min-height: 42px; background: var(--surface); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 0 11px; border: 1px solid var(--rule); background: transparent; font-size: 12px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); }
.seg button { flex: 1 1 auto; min-height: 36px; padding: 0 10px; border: 0; border-right: 1px solid var(--rule); background: transparent; font-size: 12px; font-weight: 700; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-block: 12px 4px; scroll-snap-type: x proximity; }
.col { border-top: 3px solid var(--rule); scroll-snap-align: start; min-width: 0; }
.col h3 { margin: 0; padding: 8px 0; font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; }
.col h3 .n { font-family: var(--font-mono); font-size: 12px; }
.card { border: 1px solid var(--line); background: var(--surface); padding: 10px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.card .open { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.card select { min-height: 36px; border: 1px solid var(--line); background: var(--bg); padding: 0 6px; font-size: 13px; }
.colempty { font-size: 12px; color: var(--muted); padding: 6px 0 12px; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
.field small { font-weight: 400; color: var(--muted); letter-spacing: 0; font-size: 12px; }
.field input, .field textarea, .field select { border: 1px solid var(--rule); background: var(--surface); padding: 9px 10px; font-size: 15px; font-weight: 400; min-width: 0; border-radius: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.toggle { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.toggle b { font-size: 15px; }
.toggle p { margin: 0; font-size: 13px; color: var(--muted); grid-column: 1; }
.switch { grid-row: 1 / span 2; grid-column: 2; position: relative; width: 52px; height: 30px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.switch span { position: absolute; inset: 0; border: 2px solid var(--rule); background: var(--bg); pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--rule); transition: transform .15s ease; }
.switch input:checked + span { background: var(--signal); border-color: var(--signal); }
.switch input:checked + span::after { transform: translateX(22px); background: #ffffff; }
.switch input:focus-visible + span { outline: 2px solid var(--signal); outline-offset: 2px; }
.primary { min-height: 46px; padding: 0 18px; border: 0; background: var(--invert-bg); color: var(--invert-fg); font-weight: 800; font-size: 15px; }
.ghost { min-height: 46px; padding: 0 16px; border: 1px solid var(--rule); background: transparent; font-weight: 700; font-size: 14px; }
.primary:disabled, .ghost:disabled { opacity: 0.55; cursor: progress; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.saved { font-family: var(--font-mono); font-size: 12px; color: var(--good); }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--rule); padding: 1px 6px; min-width: 22px; display: inline-block; text-align: center; }
details.log { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 12px; }
details.log summary { cursor: pointer; font-weight: 800; padding-block: 6px; }
details.log .form { margin-top: 10px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 3px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
nav.tabs button { min-height: 54px; border: 0; background: transparent; font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
nav.tabs button[aria-current="page"] { color: var(--signal); }
nav.tabs .n { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--muted); min-height: 12px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  width: min(520px, calc(100% - 32px)); background: var(--invert-bg); color: var(--invert-fg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 16px; font-size: 14px; font-weight: 600;
}
.toast button { min-height: 40px; padding: 0 14px; border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 800; }

.scrim { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 760px) { .scrim { align-items: center; } }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-top: 3px solid var(--rule);
  padding-top: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 760px) { .sheet { border: 3px solid var(--rule); } }
.sheet-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.sheet-head .fitnum { font-size: 72px; }
.sheet-head h2 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
.x { width: 44px; height: 44px; border: 1px solid var(--rule); background: transparent; font-size: 18px; font-weight: 800; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 24px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; background: var(--line); position: relative; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); }
.bar b { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.kv { font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.kv .gap { color: var(--muted); }
.stagepick { display: flex; flex-wrap: wrap; gap: 6px; }
.stagepick button { min-height: 40px; padding: 0 12px; border: 1px solid var(--rule); background: transparent; font-size: 13px; font-weight: 700; }
.stagepick button[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.reasons { display: flex; flex-wrap: wrap; gap: 8px; }
.reasons button { min-height: 46px; padding: 0 14px; border: 1px solid var(--rule); background: transparent; font-weight: 700; font-size: 14px; }
.link-out { color: var(--signal); font-weight: 800; text-decoration: none; }
.link-out:hover { text-decoration: underline; }

.onb { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; }
.onb .in { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
.onb h2 { margin: 0; font-size: 34px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; text-wrap: balance; }
.onb h2:focus { outline: none; }
.onb .lead { margin: 0; font-size: 16px; color: var(--muted); max-width: 52ch; }
.steps { display: flex; gap: 6px; }
.steps span { height: 4px; flex: 1; background: var(--line); }
.steps span.on { background: var(--signal); }
.bigrule { border-top: 3px solid var(--rule); }
.feature { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.feature .num { font-weight: 900; font-size: 36px; line-height: 0.9; color: var(--signal); }
.feature b { display: block; font-size: 15px; }
.feature span { font-size: 14px; color: var(--muted); }
.status-line { font-size: 13px; color: var(--amber); min-height: 1.2em; }
.filebtn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border: 1px solid var(--rule); background: var(--invert-bg); color: var(--invert-fg); font-weight: 800; font-size: 14px; cursor: pointer; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.filebtn:focus-within { outline: 2px solid var(--signal); outline-offset: 2px; }
.resume-box { display: flex; flex-direction: column; gap: 10px; }
.resume-box textarea { min-height: 200px; font-size: 14px; line-height: 1.5; }
.resume-meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.privacy { margin: 0; font-size: 13px; color: var(--muted); max-width: 60ch; }
.privacy b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--amber); }
.nudge { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.letter textarea.out { min-height: 320px; font-size: 15px; line-height: 1.55; }
.letter textarea.jd { min-height: 90px; font-size: 14px; }
.thinking { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-height: 1.2em; }
.letter .field { margin-top: 6px; }
.sheet > * { flex-shrink: 0; }
@media (max-width: 520px) { .form { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .switch span::after { transition: none; } }
</style>

<div class="app" id="app">
  <header class="top pad">
    <h1 class="brand">Hirelist<span>.</span></h1>
    <div class="stamp" id="stamp">LOADING…</div>
  </header>
  <main id="main" class="pad">
    <div class="empty"><strong>Opening your list</strong>Your saved jobs will appear here in a moment.</div>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-view="today" aria-current="page">Today<span class="n" id="n-today"></span></button>
    <button type="button" data-view="all">All jobs<span class="n" id="n-all"></span></button>
    <button type="button" data-view="board">Board<span class="n" id="n-board"></span></button>
    <button type="button" data-view="settings">Settings<span class="n"></span></button>
  </div>
</nav>

<div id="toastHost" aria-live="polite"></div>
<div id="sheetHost"></div>
<div id="onbHost"></div>

<script>
(function () {
  var VERSION = "1.0.0";
  var COLL = "jobs", SETDOC = "settings/prefs", RESDOC = "settings/resume";
  var LIBS = {
    pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
    pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
    jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    jszip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
  };
  var PIPE = ["applied", "interviewing", "offer", "rejected", "no_response"];
  var LABEL = { "new": "To review", applied: "Applied", interviewing: "Interviewing", offer: "Offer", rejected: "Rejected", no_response: "No response", skipped: "Not for me", expired: "Expired" };
  var REASONS = [["wrong_role", "Wrong role"], ["too_senior", "Too senior"], ["salary", "Salary too low"], ["location", "Location"], ["company", "Company"], ["other", "Other"]];
  var BREAK = [["skills", "Skills"], ["experience", "Experience"], ["role", "Role match"], ["location", "Location"]];
  var DEFAULTS = { onboarded: false, name: "", roles: "", avoid: "", maxYears: 3, location: "", salaryFloor: "", learnFromDismissals: true, autoCheckClosed: true, followUps: true, followUpDays: 7 };

  var db = null, jobs = [], settings = null, jobsReady = false, settingsReady = false;
  var view = "today", q = "", sort = "fit", fAI = false, fRemote = false, fSource = null, statusFilter = "review";
  var openId = null, reasonFor = null, undoState = null, toastTimer = null, suppressClick = false;
  var letterMsg = "";
  var resume = null, resumeReady = false, letterFor = null, letterCtl = null, sheetLocked = false, onbResume = null;
  var chains = {}, noteTimers = {};
  var mainEl = document.getElementById("main");
  var stampEl = document.getElementById("stamp");
  var searchInput = null;

  /* ---------- helpers ---------- */
  function today() {
    try { return new Date().toLocaleDateString("en-CA"); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function daysSince(d) {
    if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return null;
    var a = Date.parse(d.slice(0, 10) + "T00:00:00Z"), b = Date.parse(today() + "T00:00:00Z");
    return Math.max(0, Math.round((b - a) / 86400000));
  }
  function fmtDate(d) {
    if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return "";
    var p = d.slice(0, 10).split("-");
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1] - 1] + " " + (+p[2]);
  }
  function slug(company, title) {
    return (String(company) + "-" + String(title)).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 120).replace(/-+$/g, "");
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function esc(s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/"/g, '\\"'); }
  function statusOf(j) { return LABEL[j.status] ? j.status : "new"; }
  function inPipe(j) { return PIPE.indexOf(statusOf(j)) >= 0; }
  function isAI(j) { return j.isAI === true || /(^|[^a-z])(ai|llm|genai|prompt|machine learning|artificial intelligence)([^a-z]|$)/i.test(String(j.title || "")); }
  function isRemote(j) { return /remote|work from home|wfh/i.test(String(j.location || "")); }
  function fitOf(j) { var n = Number(j.fit); return j.fit == null || j.fit === "" || isNaN(n) ? null : n; }
  function byId(id) { for (var i = 0; i < jobs.length; i++) if (jobs[i].id === id) return jobs[i]; return null; }
  function S() { return Object.assign({}, DEFAULTS, settings || {}); }
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;

    } else if (inPipe(j)) {
      actions = h("div", { class: "stagepick", role: "group", "aria-label": "Stage" }, PIPE.map(function (s) {

        h("div", { style: "display:flex;flex-direction:column;gap:4px;min-width:0" }, [

          h("h2", { id: "sheet-title", text: j.title || "Untitled role" }),

      ]),
      h("div", { class: "hint", style: "padding:0;flex-wrap:wrap" }, [
        h("span", { text: [j.source, j.posted ? "posted " + fmtDate(j.posted) : null].filter(Boolean).join(" · ").toUpperCase() }),
        age != null ? h("span", { style: age >= 21 ? "color:var(--amber);font-weight:700" : null, text: age + " DAYS OLD" }) : null,
        j.salary ? h("span", { text: String(j.salary) }) : null
      ]),

      actions,
      h("div", { class: "btnrow" }, [h("button", { type: "button", class: "ghost", text: j.coverLetter ? "✎ Open cover letter" : "✎ Write a cover letter", onclick: function () { openLetter(j.id); } })]),

  /* ---------- reason picker ---------- */
  function closeReason() { reasonFor = null; document.getElementById("sheetHost").replaceChildren(); }
  function renderReason() {
    var host = document.getElementById("sheetHost");
    var j = reasonFor && byId(reasonFor);
    if (!j) { closeReason(); return; }
    function pick(r) { closeReason(); setStatus(j, "skipped", { reason: r }); }
    var sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "rs-title" }, [
      h("div", { class: "sheet-head", style: "grid-template-columns:minmax(0,1fr) auto" }, [
        h("div", { style: "display:flex;flex-direction:column;gap:4px;min-width:0" }, [
          h("span", { class: "tag dim", text: "NOT FOR ME" }),
          h("h2", { id: "rs-title", text: "What's off about " + (j.title || "this job") + "?" })
        ]),
        h("button", { type: "button", class: "x", "aria-label": "Cancel", text: "✕", onclick: closeReason })
      ]),
      h("p", { class: "rmeta", style: "margin:0;font-size:14px", text: "Your shortlist uses this to pick better jobs. You can turn this off in Settings." }),
      h("div", { class: "reasons" }, REASONS.map(function (r) { return h("button", { type: "button", text: r[1], onclick: function () { pick(r[0]); } }); })),
      h("button", { type: "button", class: "ghost", style: "align-self:flex-start", text: "Skip without a reason", onclick: function () { pick(null); } })

    host.replaceChildren(scrim);
    var first = sheet.querySelector(".reasons button"); if (first) first.focus();
  }

  /* ---------- onboarding ---------- */
  var onbStep = 0, onbDraft = null, onbReplay = false;
  function openOnboarding(replay) {
    onbStep = 0; onbDraft = S(); onbReplay = !!replay;
    onbResume = { text: (resume && resume.text) || "", name: (resume && resume.fileName) || "", source: resume && resume.source, updatedOn: resume && resume.updatedOn };
    renderOnb();
  }
  function renderOnb() {
    var host = document.getElementById("onbHost");
    var root = h("div", { class: "in pad" });
    var dots = h("div", { class: "steps", role: "img", "aria-label": "Step " + (onbStep + 1) + " of 5" }, [0, 1, 2, 3, 4].map(function (i) { return h("span", { class: i <= onbStep ? "on" : "" }); }));
    var status = h("div", { class: "status-line", role: "status" });
    function capture() { Object.assign(onbDraft, readPrefs(root, "o-")); }
    function next() { capture(); onbStep++; renderOnb(); }
    function back() { capture(); onbStep--; renderOnb(); }
    var body;
    if (onbStep === 0) {
      body = [
        h("h2", null, ["Hirelist", h("span", { style: "color:var(--signal)", text: "." })]),
        h("p", { class: "lead", text: "Every weekday, your shortlist searches job sites for roles that fit your resume. This is where you sort them." }),
        h("div", { class: "bigrule" }, [
          h("div", { class: "feature" }, [h("span", { class: "num", text: "1" }), h("div", null, [h("b", { text: "Today" }), h("span", { text: "The three best jobs to apply to, plus follow-ups that need a nudge." })])]),
          h("div", { class: "feature" }, [h("span", { class: "num", text: "2" }), h("div", null, [h("b", { text: "Swipe to sort" }), h("span", { text: "Right for applied, left for not for me. Nothing you've sorted comes back." })])]),
          h("div", { class: "feature" }, [h("span", { class: "num", text: "3" }), h("div", null, [h("b", { text: "Board" }), h("span", { text: "Track every application from applied to offer." })])])
        ]),
        h("div", { class: "btnrow" }, [h("button", { type: "button", class: "primary", text: "Set up my search", onclick: next }),
          onbReplay ? h("button", { type: "button", class: "ghost", text: "Close", onclick: closeOnb }) : null])
      ];
    } else if (onbStep === 1) {
      body = [
        h("h2", { text: "Add your resume" }),
        h("p", { class: "lead", text: "Your shortlist reads it to find jobs that fit you, and cover letters are written from it. Upload a PDF or paste the text. You can skip this and add it later in Settings." }),
        resumeEditor(onbResume, null, "o-res"),
        privacyNote(),
        h("div", { class: "btnrow" }, [h("button", { type: "button", class: "primary", text: "Next", onclick: next }), h("button", { type: "button", class: "ghost", text: "Back", onclick: back })])
      ];
    } else if (onbStep === 2) {
      body = [
        h("h2", { text: "What are you looking for?" }),
        h("p", { class: "lead", text: "Your shortlist uses this together with your resume. You can change it any time in Settings." }),
        h("div", { class: "form" }, prefsFields(onbDraft, "o-")),
        h("div", { class: "btnrow" }, [h("button", { type: "button", class: "primary", text: "Next", onclick: next }), h("button", { type: "button", class: "ghost", text: "Back", onclick: back })])
      ];
    } else if (onbStep === 3) {
      body = [
        h("h2", { text: "Pick your extras" }),
        h("p", { class: "lead", text: "Each one is optional. Switch any of them off now, or later in Settings." }),
        h("div", { class: "bigrule" }, smartToggles(onbDraft, "o-")),
        h("div", { class: "btnrow" }, [h("button", { type: "button", class: "primary", text: "Next", onclick: next }), h("button", { type: "button", class: "ghost", text: "Back", onclick: back })])
      ];
    } else {
      body = [
        h("h2", { text: "You're set" + (onbDraft.name ? ", " + onbDraft.name : "") + "." }),
        h("p", { class: "lead", text: "New matches arrive each weekday morning. A few things to know:" }),
        h("div", { class: "bigrule" }, [
          h("div", { class: "feature" }, [h("span", { class: "num", text: "→" }), h("div", null, [h("b", { text: "Swipe right once you apply" }), h("span", { text: "Or open a job and tap I applied. It moves to your Board." })])]),
          h("div", { class: "feature" }, [h("span", { class: "num", text: "←" }), h("div", null, [h("b", { text: "Swipe left to pass" }), h("span", { text: onbDraft.learnFromDismissals ? "Pick a reason so tomorrow's picks get sharper." : "It won't be suggested again." })])]),
          h("div", { class: "feature" }, [h("span", { class: "num", text: "✉" }), h("div", null, [h("b", { text: "Cover letters in one tap" }), h("span", { text: String(onbResume.text || "").trim() ? "Open any job and tap Write a cover letter. Copy it, or save it as PDF or Word." : "Add your resume in Settings, then open any job and tap Write a cover letter." })])]),
          h("div", { class: "feature" }, [h("span", { class: "num", text: "✎" }), h("div", null, [h("b", { text: "Keep notes on each job" }), h("span", { text: "Contacts, interview dates, salary talks. On a computer, try the J, K, A and X keys." })])])
        ]),
        status,
        h("div", { class: "btnrow" }, [h("button", { type: "button", class: "primary", id: "onb-finish", text: "Start using Hirelist", onclick: function () {
          var btn = root.querySelector("#onb-finish"); btn.disabled = true;
          var hasResume = String(onbResume.text || "").trim().length > 0;
          (hasResume ? saveResume(onbResume) : Promise.resolve()).then(function () {
            return saveSettings(Object.assign({}, onbDraft, { onboarded: true }));
          }).then(closeOnb, function (e) {
            btn.disabled = false; status.textContent = e && e.code === "invalid_argument" ? "Only the list's owner can save these settings." : "Couldn't save. Check your connection and try again.";
          });
        } }), h("button", { type: "button", class: "ghost", text: "Back", onclick: back })])
      ];
    }
    root.replaceChildren.apply(root, [dots].concat(body));
    host.replaceChildren(h("div", { class: "onb", role: "dialog", "aria-modal": "true", "aria-label": "Set up Hirelist" }, [root]));
    var focusEl = root.querySelector("h2"); if (focusEl) { focusEl.setAttribute("tabindex", "-1"); focusEl.focus(); }
  }
  function closeOnb() {
    document.getElementById("onbHost").replaceChildren();
    if (view === "settings") mainEl.replaceChildren();
    render();
  }
  function maybeOnboard() {
    if (!settingsReady || document.getElementById("onbHost").childNodes.length) return;
    if (!settings || !settings.onboarded) openOnboarding(false);
  }

  /* ---------- keyboard + nav ---------- */
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.addEventListener("click", function () { go(b.dataset.view); }); });
  document.addEventListener("keydown", function (e) {
    var t = e.target, tag = (t.tagName || "").toLowerCase();
    var onbOpen = document.getElementById("onbHost").childNodes.length > 0;
    if (e.key === "Escape") {
      if (onbOpen && settings && settings.onboarded) { closeOnb(); return; }
      if (reasonFor) { closeReason(); return; }
      if (letterFor) { if (!sheetLocked) backFromLetter(); return; }
      if (openId) { closeSheet(); return; }
    }
    if (tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (onbOpen || openId || reasonFor) return;
    var rows = [].slice.call(mainEl.querySelectorAll(".rowmain"));
    var idx = rows.indexOf(document.activeElement);
    if (e.key === "j" || (e.key === "ArrowDown" && idx >= 0)) { e.preventDefault(); var n = rows[idx + 1] || rows[0]; if (n) n.focus(); }
    else if (e.key === "k" || (e.key === "ArrowUp" && idx >= 0)) { e.preventDefault(); var p = rows[idx - 1] || rows[rows.length - 1]; if (p) p.focus(); }
    else if (e.key === "/") { e.preventDefault(); if (view !== "all") go("all"); ensureSearch().focus(); }
    else if (e.key === "u") { doUndo(); }
    else if (idx >= 0) {
      var j = byId(rows[idx].dataset.jid);
      if (!j || statusOf(j) !== "new") return;
      if (e.key === "a") act(j, "applied"); else if (e.key === "x") act(j, "skip"); else if (e.key === "e") act(j, "expired");
    }
  });

  /* ---------- boot ---------- */
  if (!(window.claude && window.claude.use)) {
    mainEl.replaceChildren(h("div", { class: "empty" }, [h("strong", { text: "Open Hirelist in Claude" }), "Your saved jobs load only inside the Claude app or on claude.ai."]));
    stampEl.textContent = "";
    return;
  }
  window.claude.use("db").then(function (d) {
    if (!d) {
      mainEl.replaceChildren(h("div", { class: "empty" }, [h("strong", { text: "Sign in to see your jobs" }), "Your list loads once you're signed in to Claude."]));
      stampEl.textContent = "";
      return;
    }
    db = d;
    db.collection(COLL).onSnapshot(function (snap) {
      jobs = snap.docs.map(function (s) { var o = Object.assign({}, s.data()); o.id = s.id; return o; });
      jobsReady = true;
      if (openId && !byId(openId)) closeSheet();
      render();
    }, function () { showToast("Lost the connection to your jobs. Reload to reconnect.", null); });
    db.doc(SETDOC).onSnapshot(function (snap) {
      settings = snap.exists ? Object.assign({}, snap.data()) : null;
      settingsReady = true;
      maybeOnboard();
      if (jobsReady && view !== "settings") render();
    }, function () { settingsReady = true; });
    db.doc(RESDOC).onSnapshot(function (snap) {
      resume = snap.exists ? Object.assign({}, snap.data()) : null;

      if (view === "settings") { if (!mainEl.contains(document.activeElement)) renderSettings(); }
      else if (jobsReady) render();
    }, function () { resumeReady = true; });
  });
})();
